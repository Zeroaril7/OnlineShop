services:
  mongodb:
    image: mongo:latest
    container_name: online_shop_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - shop_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: online_shop_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/online_shop
    depends_on:
      - mongodb
    networks:
      - shop_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: online_shop_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - shop_net

volumes:
  mongo_data:

networks:
  shop_net:
    driver: bridge
